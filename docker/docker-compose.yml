# HunterSim 开发环境编排
# 使用：docker-compose -f docker/docker-compose.yml up -d
# CARLA 服务运行在宿主机 Windows（需单独启动 CarlaUE4.exe）

version: "3.9"

services:
  # ── Kafka 消息队列 ──────────────────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CARLA 仿真引擎（可选，Linux + NVIDIA GPU 环境启用）──────────────────────
  # 设计文档 §10.2.3/§15.3：每个 CARLA 实例运行在独立容器，NVIDIA Container Toolkit 分配 GPU
  # 启用：docker-compose -f docker/docker-compose.yml --profile carla up -d
  carla-engine:
    profiles: ["carla"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.carla
    image: hunter-carla:0.9.16
    ports:
      - "2000:2000"   # RPC
      - "2001:2001"   # 数据流
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    runtime: nvidia
    volumes:
      # 地图/模型资源卷（§10.4.1 资源仓库，含自定义地图 maps/custom）
      - ../resources:/home/carla/carla/PythonAPI/hunter_assets/resources
    restart: unless-stopped

  # ── HunterSim 仿真服务 ──────────────────────────────────────────────────
  sim-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HUNTER_SIM_ENV: dev
      HUNTER_SIM_LOG_LEVEL: INFO
      CARLA_HOST: host.docker.internal
      CARLA_RPC_PORT: "2000"
      CARLA_STREAM_PORT: "2001"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_JWT_SECRET: CHANGE_ME_IN_PRODUCTION
      API_PORT: "8080"
    depends_on:
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../configs:/home/hunter/app/configs:ro
      # 资源仓库（自定义地图上传与回放数据落盘，§10.4.1/§15.5）
      - ../resources:/home/hunter/app/resources
    restart: unless-stopped

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则（设计文档 §15.4）
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ── Alertmanager 告警投递（审查项 S：prometheus.yml alerting 段的目标） ──────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  # ── Grafana 可视化 ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  kafka_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
