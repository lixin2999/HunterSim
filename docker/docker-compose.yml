# HunterSim 开发/单机部署编排（V3.0.0）
# 使用：
#   cp .env.example .env          # 按需修改 CARLA 地址与平台凭据（仓库根目录）
#   docker compose -f docker/docker-compose.yml up -d
# CARLA server 运行在宿主机（Windows：先启动 CarlaUE4.exe；Linux：可选 --profile carla）
# 镜像内已安装 carla==0.9.16 Python SDK，控制面可直接下发场景并生成自车。
#
# V3.0.0 架构：仿真端只做「执行」，治理（用户/租户/场景库/批量/审计/OTA）全部归云端。
#   sim-service   :8090  唯一业务入口（控制面 + VIL Bridge + 场景 + 传感器 + 录制）
#   probes        :8080  只读探针面（/health + /metrics），同镜像不同子命令
# 受支持形态 = 单副本 + 重启恢复 + 单世界串行：不再使用 EXECUTION_ENGINE_ENDPOINTS
# 双引擎示例（端点库存留空即单引擎，取 CARLA_HOST:CARLA_RPC_PORT）。
# ROS2 出口改为进程内 CarlaRosBridge（场景 sensors[].ros_enabled 开关），
# 不再需要独立 ros2-bridge 容器。

services:
  # ── Kafka 消息队列（VIL 消费 + sensor_data 回传）────────────────────────────
  kafka:
    # bitnami/kafka 的旧 tag 已从 Docker Hub 免费目录下架（Nov 2024 迁移）；
    # 改用内容一致的 bitnamilegacy/kafka（KAFKA_CFG_* 环境变量与 healthcheck 均不变）。
    image: bitnamilegacy/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── CARLA 仿真引擎（可选，Linux + NVIDIA GPU 环境启用）──────────────────────
  # 设计文档 §10.2.3/§15.3：单世界串行，一台引擎承载唯一场景。
  # 启用：docker-compose -f docker/docker-compose.yml --profile carla up -d
  carla-engine:
    profiles: ["carla"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.carla
    image: hunter-carla:0.9.16
    ports:
      - "2000:2000"   # RPC
      - "2001:2001"   # 数据流
      - "8000:8000"   # Traffic Manager
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    runtime: nvidia
    volumes:
      # 地图/模型资源卷（§10.4.1 资源仓库，含自定义地图 maps/custom）
      - ../resources:/home/carla/carla/PythonAPI/hunter_assets/resources
    restart: unless-stopped

  # ── HunterSim 控制面（唯一业务入口，8090）──────────────────────────────────
  sim-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # CARLA Python SDK 版本必须与宿主机 CARLA server 严格一致
        CARLA_VERSION: ${CARLA_VERSION:-0.9.16}
        # 无 manylinux wheel 的平台（如 ARM）可置为 false，服务仍可启动但下发场景返回 503
        INSTALL_CARLA: ${INSTALL_CARLA:-true}
        # 国内/慢速网络构建时 pip 直连 PyPI 易超时（carla wheel 34MB），可切换镜像源：
        # PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ PIP_TRUSTED_HOST=mirrors.aliyun.com
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    image: hunter-sim:3.0.1
    command: ["carla-manager"]
    ports:
      - "8090:8090"
    environment:
      HUNTER_SIM_ENV: ${HUNTER_SIM_ENV:-dev}
      HUNTER_SIM_LOG_LEVEL: ${HUNTER_SIM_LOG_LEVEL:-INFO}
      HUNTER_SIM_LOG_JSON: ${HUNTER_SIM_LOG_JSON:-false}
      HUNTER_SIM_LOG_FILE: ${HUNTER_SIM_LOG_FILE:-}
      # ── CARLA 引擎 ──
      CARLA_HOST: ${CARLA_HOST:-host.docker.internal}
      CARLA_RPC_PORT: ${CARLA_RPC_PORT:-2000}
      CARLA_STREAM_PORT: ${CARLA_STREAM_PORT:-2001}
      CARLA_TIMEOUT_SECONDS: ${CARLA_TIMEOUT_SECONDS:-10.0}
      # 本地 CARLA 进程自愈：仅托管回环端点；容器内默认关闭，
      # 引擎容器由 docker restart / K8s liveness 负责，避免跨层抢管进程
      CARLA_SUPERVISOR_ENABLED: ${CARLA_SUPERVISOR_ENABLED:-false}
      CARLA_SUPERVISOR_BINARY_PATH: ${CARLA_SUPERVISOR_BINARY_PATH:-}
      CARLA_SUPERVISOR_MAX_RESTARTS: ${CARLA_SUPERVISOR_MAX_RESTARTS:-3}
      CARLA_SUPERVISOR_RESTART_BACKOFF_SECONDS: ${CARLA_SUPERVISOR_RESTART_BACKOFF_SECONDS:-5}
      # ── Kafka（VIL 遥测消费 + sensor_data 回传）──
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TELEMETRY_TOPIC: ${KAFKA_TELEMETRY_TOPIC:-carla.{sim_id}.vil_state}
      KAFKA_SIM_ID: ${KAFKA_SIM_ID:-}
      KAFKA_LEGACY_TELEMETRY_TOPIC: ${KAFKA_LEGACY_TELEMETRY_TOPIC:-}
      KAFKA_ENABLE_SELF_HEAL: ${KAFKA_ENABLE_SELF_HEAL:-true}
      KAFKA_REBUILD_AFTER_ERRORS: ${KAFKA_REBUILD_AFTER_ERRORS:-10}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-}
      # ── VIL 链路对齐（V3.0.0：10Hz 栅格降采样 + 插值）──
      VIL_TARGET_HZ: ${VIL_TARGET_HZ:-10.0}
      VIL_ORDERING_GUARD_ENABLED: ${VIL_ORDERING_GUARD_ENABLED:-true}
      VIL_AUTO_BUFFER_DEPTH: ${VIL_AUTO_BUFFER_DEPTH:-true}
      VIL_TELEMETRY_FREQUENCY_HZ: ${VIL_TELEMETRY_FREQUENCY_HZ:-10.0}
      VIL_MAX_DATA_LATENCY_MS: ${VIL_MAX_DATA_LATENCY_MS:-500}
      VIL_OVERLAY_ENABLED: ${VIL_OVERLAY_ENABLED:-true}
      VIL_LIGHTS_ENABLED: ${VIL_LIGHTS_ENABLED:-true}
      # ── 资源与执行面（单世界串行：端点库存留空即单引擎）──
      RESOURCE_INSTANCE_MAX_LIFETIME_SECONDS: ${RESOURCE_INSTANCE_MAX_LIFETIME_SECONDS:-7200}
      RESOURCE_HEALTH_CHECK_INTERVAL_SECONDS: ${RESOURCE_HEALTH_CHECK_INTERVAL_SECONDS:-10}
      EXECUTION_RESTORE_SCENE_ON_ASSEMBLE: ${EXECUTION_RESTORE_SCENE_ON_ASSEMBLE:-true}
      EXECUTION_LEASE_HEARTBEAT_ENABLED: ${EXECUTION_LEASE_HEARTBEAT_ENABLED:-true}
      EXECUTION_LEASE_TTL_SECONDS: ${EXECUTION_LEASE_TTL_SECONDS:-120}
      # ── 控制面（8090）：实例注册表 / 产物 / 录制 / 画面 ──
      ADAPTER_HOST: 0.0.0.0
      ADAPTER_PORT: "8090"
      ADAPTER_DB_PATH: ${ADAPTER_DB_PATH:-data/adapter/carla_instances.db}
      ADAPTER_ARTIFACTS_DIR: ${ADAPTER_ARTIFACTS_DIR:-data/adapter/artifacts}
      ADAPTER_RECORDINGS_DIR: ${ADAPTER_RECORDINGS_DIR:-data/adapter/recordings}
      ADAPTER_RECORDING_RETENTION_HOURS: ${ADAPTER_RECORDING_RETENTION_HOURS:-24}
      ADAPTER_ARTIFACT_BUCKET: ${ADAPTER_ARTIFACT_BUCKET:-hunter-scene-assets}
      ADAPTER_WATCHDOG_FACTOR: ${ADAPTER_WATCHDOG_FACTOR:-3.0}
      ADAPTER_WATCHDOG_GRACE_SECONDS: ${ADAPTER_WATCHDOG_GRACE_SECONDS:-120}
      ADAPTER_PROGRESS_INTERVAL_SECONDS: ${ADAPTER_PROGRESS_INTERVAL_SECONDS:-0.5}
      ADAPTER_BUSY_TIMEOUT_SECONDS: ${ADAPTER_BUSY_TIMEOUT_SECONDS:-5.0}
      ADAPTER_STREAM_FPS: ${ADAPTER_STREAM_FPS:-10.0}
      ADAPTER_SCREENSHOT_QUALITY: ${ADAPTER_SCREENSHOT_QUALITY:-75}
      # MJPEG 推流横向降采样上限（像素，0 = 不降采样）；降低内网带宽占用
      ADAPTER_STREAM_MAX_WIDTH: ${ADAPTER_STREAM_MAX_WIDTH:-640}
      # MJPEG 并发客户端上限（超限返回 503；0 = 不限）
      ADAPTER_STREAM_MAX_CLIENTS: ${ADAPTER_STREAM_MAX_CLIENTS:-8}
      ADAPTER_DEFAULT_DURATION_SECONDS: ${ADAPTER_DEFAULT_DURATION_SECONDS:-60}
      ADAPTER_MAX_SCENE_SECONDS: ${ADAPTER_MAX_SCENE_SECONDS:-7200}
      # ── HunterCore 平台接入（默认关闭，凭据仅经 .env / Secret 注入）──
      HUNTER_CORE_ENABLED: ${HUNTER_CORE_ENABLED:-false}
      HUNTER_CORE_KAFKA_BOOTSTRAP: ${HUNTER_CORE_KAFKA_BOOTSTRAP:-kafka:9092}
      HUNTER_CORE_SECURITY_PROTOCOL: ${HUNTER_CORE_SECURITY_PROTOCOL:-SASL_SSL}
      HUNTER_CORE_SASL_MECHANISM: ${HUNTER_CORE_SASL_MECHANISM:-SCRAM-SHA-512}
      HUNTER_CORE_SASL_USERNAME: ${HUNTER_CORE_SASL_USERNAME:-}
      HUNTER_CORE_SASL_PASSWORD: ${HUNTER_CORE_SASL_PASSWORD:-}
      HUNTER_CORE_SIM_ID: ${HUNTER_CORE_SIM_ID:-}
      HUNTER_CORE_GATEWAY_URL: ${HUNTER_CORE_GATEWAY_URL:-http://192.168.31.35:8080}
      HUNTER_CORE_JWT_TOKEN: ${HUNTER_CORE_JWT_TOKEN:-}
      HUNTER_CORE_ROSBAG_BUCKET: ${HUNTER_CORE_ROSBAG_BUCKET:-hunter-rosbag}
      HUNTER_CORE_UPLOAD_TIMEOUT_S: ${HUNTER_CORE_UPLOAD_TIMEOUT_S:-60.0}
      HUNTER_CORE_UPLOAD_QUEUE_MAX_SIZE: ${HUNTER_CORE_UPLOAD_QUEUE_MAX_SIZE:-32}
    depends_on:
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../configs:/home/hunter/app/configs:ro
      # 资源仓库（自定义地图与传感器配置，§10.4.1）
      - ../resources:/home/hunter/app/resources
      # 实例注册表 + 产物 + mcap 录制（重启恢复；录制按保留期清理）
      - ../data:/home/hunter/app/data
    restart: unless-stopped

  # ── 只读运维探针面（8080，无业务无鉴权）─────────────────────────────────────
  probes:
    image: hunter-sim:3.0.1
    command: ["probes"]
    ports:
      - "8080:8080"
    environment:
      PROBE_HOST: 0.0.0.0
      PROBE_PORT: "8080"
      # 聚合控制面 /health 的真实状态（CARLA/VIL/传感器/云端）
      PROBE_ADAPTER_URL: http://sim-service:8090
      HUNTER_SIM_LOG_LEVEL: ${HUNTER_SIM_LOG_LEVEL:-INFO}
    depends_on:
      sim-service:
        condition: service_started
    restart: unless-stopped

  # ── Prometheus 监控（抓取 sim-service:8090 业务指标 + probes:8080 探针指标）────────
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则（设计文档 §15.4）
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    # 就绪探针（busybox wget 镜像内置），供下游依赖条件判定
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Alertmanager 告警投递（prometheus.yml alerting 段的目标）─────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # ── Grafana 可视化 ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # 等 Prometheus 健康后再启动，避免数据源首连失败反复重试
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  kafka_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
