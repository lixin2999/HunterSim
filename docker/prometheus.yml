# HunterSim Prometheus 抓取配置
# 由 docker-compose 挂载至 /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（设计文档 §15.4 监控与告警阈值）
rule_files:
  - /etc/prometheus/alerts.yml

# 审查项 S：缺少 alerting 段时 alerts.yml 规则仅计算不投递；
# 此处对接 Alertmanager（docker-compose 中的 alertmanager 服务）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # HunterSim 仿真服务指标（免鉴权端点）
  - job_name: "hunter-sim"
    metrics_path: /api/v1/sim/metrics
    static_configs:
      - targets: ["sim-service:8080"]

  # Prometheus 自监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
