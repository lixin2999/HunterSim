# HunterSim Prometheus 抓取配置
# 由 docker-compose 挂载至 /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（设计文档 §15.4 监控与告警阈值）
rule_files:
  - /etc/prometheus/alerts.yml

# 审查项 S：缺少 alerting 段时 alerts.yml 规则仅计算不投递；
# 此处对接 Alertmanager（docker-compose 中的 alertmanager 服务）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 业务面指标（V3.0.0：:8090 /metrics 导出 VIL / 传感器 / 录制 / 实例生命周期）
  - job_name: "hunter-sim-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["sim-service:8090"]

  # 只读探针面指标（uptime / 上游可达性；无业务无鉴权）
  - job_name: "hunter-sim"
    metrics_path: /metrics
    static_configs:
      - targets: ["probes:8080"]

  # Prometheus 自监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
