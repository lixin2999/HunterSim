# HunterSim Windows 单机全容器编排（V2.2.0）
#
# 前提（详见 deployment_and_operations.md「Windows 单机全容器拓扑」）：
#   - Docker Desktop for Windows，后端切换为 WSL2
#   - NVIDIA Container Toolkit（WSL2 GPU 直通，供 CARLA 渲染）
#   - 已安装 nvidia 显卡驱动（GeForce RTX 系列，设计文档 §15.3）
#
# CARLA 官方镜像为 Linux 构建，Windows 下经 WSL2 GPU 直通运行；
# 也可在宿主机原生启动 CarlaUE4.exe，桌面客户端两种都支持。
#
# 使用：docker compose -f docker/docker-compose.windows.yml up -d
# 停止：docker compose -f docker/docker-compose.windows.yml down

version: "3.9"

services:
  # ── CARLA 仿真引擎（GPU 离屏渲染）─────────────────────────────────────────
  carla-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.carla
    image: hunter-carla:0.9.16
    ports:
      - "2000:2000"   # RPC
      - "2001:2001"   # 数据流
      - "8000:8000"   # Traffic Manager
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    runtime: nvidia
    command: ["./CarlaUE4.sh", "-RenderOffScreen", "-quality-level=Medium", "-carla-rpc-port=2000"]
    volumes:
      - ../resources:/home/carla/carla/PythonAPI/hunter_assets/resources
    shm_size: "8gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ── CARLA ↔ ROS2 桥接（对齐 RosTopicMapping / ROS2_TOPIC_MAP）───────────────
  ros2-bridge:
    image: carla-simulator/ros-bridge:humble
    depends_on:
      carla-server:
        condition: service_healthy
    network_mode: host   # ROS2 DDS 发现依赖组播/主机网络，桥接话题需 host 模式
    environment:
      CARLA_HOST: carla-server
      CARLA_PORT: "2000"
      CARLA_CLIENT_ID: "0"
    command: >
      ros2 launch carla_ros_bridge carla_ros_bridge_with_example_venue.launch.py
      host:=carla-server port:=2000
    restart: unless-stopped

  # ── HunterSim 仿真管理服务（FastAPI，桌面客户端并行的服务侧入口）────────────
  sim-management:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hunter-sim:latest
    ports:
      - "8080:8080"
    environment:
      HUNTER_SIM_ENV: dev
      HUNTER_SIM_LOG_LEVEL: INFO
      CARLA_HOST: carla-server
      CARLA_RPC_PORT: "2000"
      CARLA_STREAM_PORT: "2001"
      CARLA_TM_PORT: "8000"
      API_JWT_SECRET: CHANGE_ME_IN_PRODUCTION
      API_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../configs:/home/hunter/app/configs:ro
      - ../resources:/home/hunter/app/resources
    restart: unless-stopped

  # ── Kafka（本地遥测总线；接入 HunterCore 时可改用远端 SASL_SSL broker）──────
  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka_data:
