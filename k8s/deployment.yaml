# HunterSim K8s Deployment
# 命名空间：hunter-sim
# 适用环境：Kubernetes 1.25+ with NVIDIA GPU Operator

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunter-sim-service
  namespace: hunter-sim
  labels:
    app: hunter-sim
    component: sim-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunter-sim
      component: sim-service
  template:
    metadata:
      labels:
        app: hunter-sim
        component: sim-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/sim/metrics"
    spec:
      containers:
        - name: sim-service
          image: hunter-sim:2.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: HUNTER_SIM_ENV
              value: "prod"
            - name: HUNTER_SIM_LOG_LEVEL
              value: "INFO"
            - name: CARLA_HOST
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: carla_host
            - name: CARLA_RPC_PORT
              value: "2000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_bootstrap_servers
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: jwt_secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            http:
              path: /api/v1/sim/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            http:
              path: /api/v1/sim/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: configs
              mountPath: /home/hunter/app/configs
              readOnly: true
            # 共享存储 PVC（设计文档 §15.1：地图资源/车辆模型/场景配置/仿真记录）
            - name: shared-resources
              mountPath: /home/hunter/app/resources
      volumes:
        - name: configs
          configMap:
            name: hunter-sim-configs
        - name: shared-resources
          persistentVolumeClaim:
            claimName: hunter-sim-resources-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# 共享存储 PVC（设计文档 §15.1）
# 审查项 S：ReadWriteMany 必须绑定支持 RWX 的 StorageClass（NFS/CephFS/Longhorn 等）。
# 留空会回落集群默认 StorageClass，而默认类多为 RWO（云盘/hostpath），
# 多 Pod 挂载时卡在 FailedMount。集群需预先创建同名 RWX StorageClass。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-sim-resources-pvc
  namespace: hunter-sim
spec:
  accessModes:
    - ReadWriteMany   # 仿真服务层与 CARLA GPU Pod 共享
  storageClassName: huntersim-rwx   # 指向支持 RWX 的 StorageClass（按集群实际名称修改）
  resources:
    requests:
      storage: 500Gi  # §15.2 推荐存储配置
---
# CARLA 仿真引擎 GPU Pod（设计文档 §15.1/§10.2.3）
# 需要 NVIDIA GPU Operator / Container Toolkit；每 Pod 分配 1 块 GPU，
# 单 GPU 可承载 1-2 个实例（§10.3.2 并发限制由应用层 GPU 资源池调度）
# 审查项 S：固定 RPC/流端口 2000/2001 + 应用层单端点假设（CARLA_HOST 单一），
# Deployment 多副本会导致负载均衡到错误引擎且 load_world 互相重置。
# 扩容需改 StatefulSet + per-Pod Service（配合应用层实例端口递增分配，见 instance_manager）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carla-engine
  namespace: hunter-sim
  labels:
    app: hunter-sim
    component: carla-engine
spec:
  replicas: 1   # 审查项 S：单副本——多引擎扩容见上方注释（StatefulSet 方案）
  selector:
    matchLabels:
      app: hunter-sim
      component: carla-engine
  template:
    metadata:
      labels:
        app: hunter-sim
        component: carla-engine
    spec:
      containers:
        - name: carla
          image: hunter-carla:0.9.16   # docker/Dockerfile.carla（§15.3）
          imagePullPolicy: IfNotPresent
          args: ["-RenderOffScreen", "-quality-level=Medium", "-fps=30"]  # §13.4/附录 A
          ports:
            - containerPort: 2000
              name: rpc
            - containerPort: 2001
              name: streaming
          resources:
            limits:
              nvidia.com/gpu: "1"      # NVIDIA Container Toolkit 分配
            requests:
              memory: "8Gi"            # §13.3 单实例内存 4-8GB
              cpu: "4"
          volumeMounts:
            - name: shared-resources
              mountPath: /home/carla/carla/PythonAPI/hunter_assets/resources
      volumes:
        - name: shared-resources
          persistentVolumeClaim:
            claimName: hunter-sim-resources-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# CARLA 引擎集群内访问入口（审查项 S：供 CARLA_HOST=carla-engine-svc 使用，
# 优于 configmap 中硬编码宿主机 IP 的双机分离模式）
apiVersion: v1
kind: Service
metadata:
  name: carla-engine-svc
  namespace: hunter-sim
spec:
  selector:
    app: hunter-sim
    component: carla-engine
  ports:
    - name: rpc
      port: 2000
      targetPort: 2000
    - name: streaming
      port: 2001
      targetPort: 2001
  type: ClusterIP
