# HunterSim K8s Deployment
# 命名空间：hunter-sim
# 适用环境：Kubernetes 1.25+ with NVIDIA GPU Operator
# V2.8.0：多用户体系（PLATFORM_USERS_*）；引擎自愈在 K8s 形态下由 carla-engine Pod 的
# liveness 联动重启承担（不启用进程托管 CARLA_SUPERVISOR_ENABLED）；
# 服务仍为单副本 + 重启恢复（SQLite 需 RWO 卷），多副本无状态化为长期项，见文档 §受支持形态。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunter-sim-service
  namespace: hunter-sim
  labels:
    app: hunter-sim
    component: sim-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunter-sim
      component: sim-service
  template:
    metadata:
      labels:
        app: hunter-sim
        component: sim-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/sim/metrics"
    spec:
      containers:
        - name: sim-service
          image: hunter-sim:2.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: HUNTER_SIM_ENV
              value: "prod"
            - name: HUNTER_SIM_LOG_LEVEL
              value: "INFO"
            - name: CARLA_HOST
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: carla_host
            - name: CARLA_RPC_PORT
              value: "2000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_bootstrap_servers
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: jwt_secret
            # prod 启动闸门要求：管理员口令非默认 admin、CORS 不含 "*"
            - name: API_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: admin_username
            - name: API_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: admin_password
            - name: API_CORS_ALLOW_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: cors_allow_origins
            # 执行面（V2.4.0）：端点库存决定可并行实例数，端点耗尽时创建返回 503
            - name: EXECUTION_ENGINE_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: execution_engine_endpoints
            - name: EXECUTION_MAX_ENGINES
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: execution_max_engines
            - name: EXECUTION_RESTORE_SCENE_ON_ASSEMBLE
              value: "true"
            # 状态持久化（V2.4.0）：实例/场景绑定落 SQLite，Pod 重建后恢复
            - name: STATE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: state_enabled
            - name: STATE_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: state_db_path
            # 平台化（V2.5.0）：多租户/租户配额/API Key/审计
            - name: PLATFORM_DEFAULT_TENANT
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_default_tenant
            - name: PLATFORM_MAX_INSTANCES_PER_TENANT
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_max_instances_per_tenant
            - name: PLATFORM_API_KEYS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_api_keys_enabled
            - name: PLATFORM_AUDIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_audit_enabled
            # 安全治理（V2.6.0）：按 IP 限流 + /auth/token 失败指数退避
            - name: API_RATE_LIMIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_rate_limit_enabled
            - name: API_RATE_LIMIT_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_rate_limit_per_minute
            - name: API_LOGIN_MAX_FAILED_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_login_max_failed_attempts
            - name: API_LOGIN_BACKOFF_BASE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_login_backoff_base_seconds
            - name: API_LOGIN_BACKOFF_MAX_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_login_backoff_max_seconds
            # HunterCore bag 上传有界队列（V2.6.0，仅 HUNTER_CORE_ENABLED=true 时生效）
            - name: HUNTER_CORE_UPLOAD_QUEUE_MAX_SIZE
              value: "32"
            # 稳定性加固（V2.7.0）：租约心跳 + 僵尸回收（GET /execution 看 stale，admin 可强收）
            - name: EXECUTION_LEASE_HEARTBEAT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: execution_lease_heartbeat_enabled
            - name: EXECUTION_LEASE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: execution_lease_ttl_seconds
            # 场景快照写节流（V2.7.0）：同状态最小落库间隔，降低 SQLite 单写者压力
            - name: STATE_SNAPSHOT_WRITE_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: state_snapshot_write_interval_seconds
            # Kafka 消费自愈与 DLQ / VIL 乱序闸门与自动环深（V2.7.0）
            - name: KAFKA_ENABLE_SELF_HEAL
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_enable_self_heal
            - name: KAFKA_REBUILD_AFTER_ERRORS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_rebuild_after_errors
            - name: KAFKA_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_dlq_topic
            - name: VIL_ORDERING_GUARD_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_ordering_guard_enabled
            - name: VIL_AUTO_BUFFER_DEPTH
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_auto_buffer_depth
            # JWT 吊销与滑动续期（V2.7.0，需 STATE_ENABLED=true）
            - name: API_JWT_REVOCATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_jwt_revocation_enabled
            - name: API_JWT_REFRESH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: api_jwt_refresh_enabled
            # 统一日志（V2.7.0）：生产采集置 true（JSON 行 + request_id 贯穿）
            - name: HUNTER_SIM_LOG_JSON
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: log_json
            # 多用户体系（V2.8.0 P2-13）：/auth/users 由 admin 管理，口令 PBKDF2 摘要入库
            - name: PLATFORM_USERS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_users_enabled
            - name: PLATFORM_MIN_PASSWORD_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_min_password_length
            - name: PLATFORM_PASSWORD_HASH_ITERATIONS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: platform_password_hash_iterations
            # 本地 CARLA 进程自愈（V2.8.0 P2-15）：集群形态置 false，
            # 引擎 Pod 崩溃由 livenessProbe 联动重启；仅宿主机原生 CarlaUE4 需要置 true
            - name: CARLA_SUPERVISOR_ENABLED
              value: "false"
            - name: CARLA_SUPERVISOR_BINARY_PATH
              value: ""
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            http:
              path: /api/v1/sim/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            http:
              path: /api/v1/sim/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: configs
              mountPath: /home/hunter/app/configs
              readOnly: true
            # 共享存储 PVC（设计文档 §15.1：地图资源/车辆模型/场景配置/仿真记录）
            - name: shared-resources
              mountPath: /home/hunter/app/resources
            # 状态持久化（V2.4.0）：SQLite 需独占块存储，不使用 NFS/RWX（WAL 锁不可靠）
            - name: state-data
              mountPath: /home/hunter/app/data/state
      volumes:
        - name: configs
          configMap:
            name: hunter-sim-configs
        - name: shared-resources
          persistentVolumeClaim:
            claimName: hunter-sim-resources-pvc
        - name: state-data
          persistentVolumeClaim:
            claimName: hunter-sim-state-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# 共享存储 PVC（设计文档 §15.1）
# 审查项 S：ReadWriteMany 必须绑定支持 RWX 的 StorageClass（NFS/CephFS/Longhorn 等）。
# 留空会回落集群默认 StorageClass，而默认类多为 RWO（云盘/hostpath），
# 多 Pod 挂载时卡在 FailedMount。集群需预先创建同名 RWX StorageClass。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-sim-resources-pvc
  namespace: hunter-sim
spec:
  accessModes:
    - ReadWriteMany   # 仿真服务层与 CARLA GPU Pod 共享
  storageClassName: huntersim-rwx   # 指向支持 RWX 的 StorageClass（按集群实际名称修改）
  resources:
    requests:
      storage: 500Gi  # §15.2 推荐存储配置
---
# 状态持久化卷（V2.4.0）：实例与场景绑定 SQLite。
# 必须 ReadWriteOnce（块存储/本地盘）；NFS 等 RWX 上的 SQLite WAL 锁不可靠，
# 多副本同时挂载也会损坏数据库，因此保持 sim-service replicas=1。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-sim-state-pvc
  namespace: hunter-sim
spec:
  accessModes:
    - ReadWriteOnce
  # 留空回落集群默认 StorageClass；生产建议指定本地 SSD/云盘类
  resources:
    requests:
      storage: 10Gi
---
# CARLA 仿真引擎 GPU Pod（设计文档 §15.1/§10.2.3）
# 需要 NVIDIA GPU Operator / Container Toolkit；每 Pod 分配 1 块 GPU，
# 单 GPU 可承载 1-2 个实例（§10.3.2 并发限制由应用层 GPU 资源池调度）
# V2.4.0：应用层已支持多引擎端点库存（EXECUTION_ENGINE_ENDPOINTS）。
# 扩容时建议改为 StatefulSet（稳定 DNS：carla-engine-0.carla-engine-headless）+ Headless Service，
# 并将每个 Pod 的 host:rpc 写入 EXECUTION_ENGINE_ENDPOINTS；仍禁止用普通 Deployment
# 多副本 + 单一 ClusterIP，否则 load_world 会互相重置且请求会落到错误引擎。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carla-engine
  namespace: hunter-sim
  labels:
    app: hunter-sim
    component: carla-engine
spec:
  replicas: 1   # 扩容需改 StatefulSet + Headless Service，并同步 EXECUTION_ENGINE_ENDPOINTS
  selector:
    matchLabels:
      app: hunter-sim
      component: carla-engine
  template:
    metadata:
      labels:
        app: hunter-sim
        component: carla-engine
    spec:
      containers:
        - name: carla
          image: hunter-carla:0.9.16   # docker/Dockerfile.carla（§15.3）
          imagePullPolicy: IfNotPresent
          args: ["-RenderOffScreen", "-quality-level=Medium", "-fps=30"]  # §13.4/附录 A
          ports:
            - containerPort: 2000
              name: rpc
            - containerPort: 2001
              name: streaming
          resources:
            limits:
              nvidia.com/gpu: "1"      # NVIDIA Container Toolkit 分配
            requests:
              memory: "8Gi"            # §13.3 单实例内存 4-8GB
              cpu: "4"
          volumeMounts:
            - name: shared-resources
              mountPath: /home/carla/carla/PythonAPI/hunter_assets/resources
      volumes:
        - name: shared-resources
          persistentVolumeClaim:
            claimName: hunter-sim-resources-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# CARLA 引擎集群内访问入口（审查项 S：供 CARLA_HOST=carla-engine-svc 使用，
# 优于 configmap 中硬编码宿主机 IP 的双机分离模式）
apiVersion: v1
kind: Service
metadata:
  name: carla-engine-svc
  namespace: hunter-sim
spec:
  selector:
    app: hunter-sim
    component: carla-engine
  ports:
    - name: rpc
      port: 2000
      targetPort: 2000
    - name: streaming
      port: 2001
      targetPort: 2001
  type: ClusterIP
