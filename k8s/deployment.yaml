# HunterSim K8s Deployment（V3.0.0）
# 命名空间：hunter-sim
# 适用环境：Kubernetes 1.25+ with NVIDIA GPU Operator
#
# V3.0.0 形态：单副本 + 单世界串行 + 重启恢复（SQLite 需 RWO 卷）。
# 同一 Pod 内两个容器、同镜像不同子命令：
#   sim-service :8090  唯一业务入口（控制面 + VIL Bridge + 场景 + 传感器 + 录制）
#   probes      :8080  只读探针面（/health + /metrics），供 kubelet 与 Prometheus 抓取
# 治理面（用户/租户/场景库/批量/审计/OTA）已移除，统一由云端承担；
# 引擎自愈由 carla-engine Pod 的 liveness 联动重启承担（不启用 CARLA_SUPERVISOR_ENABLED）。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunter-sim-service
  namespace: hunter-sim
  labels:
    app: hunter-sim
    component: sim-service
spec:
  replicas: 1
  # 单世界串行：新 Pod 起来前必须先停旧 Pod，避免两个进程抢同一个 CARLA 世界
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hunter-sim
      component: sim-service
  template:
    metadata:
      labels:
        app: hunter-sim
        component: sim-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        # ── 控制面（唯一业务入口）────────────────────────────────────────────
        - name: sim-service
          image: hunter-sim:3.0.3
          imagePullPolicy: IfNotPresent
          command: ["huntersim"]
          args: ["carla-manager"]
          ports:
            - containerPort: 8090
              name: adapter
              protocol: TCP
          env:
            - name: HUNTER_SIM_ENV
              value: "prod"
            - name: HUNTER_SIM_LOG_LEVEL
              value: "INFO"
            - name: HUNTER_SIM_LOG_JSON
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: log_json
            # ── CARLA 引擎 ──
            - name: CARLA_HOST
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: carla_host
            - name: CARLA_RPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: carla_rpc_port
            - name: CARLA_STREAM_PORT
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: carla_stream_port
            - name: CARLA_SUPERVISOR_ENABLED
              value: "false"
            # ── Kafka（VIL 遥测消费 + sensor_data 回传）──
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_bootstrap_servers
            - name: KAFKA_ENABLE_SELF_HEAL
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_enable_self_heal
            - name: KAFKA_REBUILD_AFTER_ERRORS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_rebuild_after_errors
            - name: KAFKA_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: kafka_dlq_topic
            # ── VIL 链路对齐（10Hz 栅格降采样 + 插值 / 转向 / 灯光 / 感知叠加）──
            - name: VIL_TARGET_HZ
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_target_hz
            - name: VIL_ORDERING_GUARD_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_ordering_guard_enabled
            - name: VIL_AUTO_BUFFER_DEPTH
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_auto_buffer_depth
            - name: VIL_MAX_DATA_LATENCY_MS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_max_data_latency_ms
            - name: VIL_OVERLAY_ENABLED
              value: "true"
            - name: VIL_LIGHTS_ENABLED
              value: "true"
            - name: VIL_CLOCK_OFFSET_AUTO
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: vil_clock_offset_auto
            # ── 资源与执行面（单世界串行：端点库存留空即单引擎）──
            - name: RESOURCE_INSTANCE_MAX_LIFETIME_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: resource_instance_max_lifetime_seconds
            - name: RESOURCE_HEALTH_CHECK_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: resource_health_check_interval_seconds
            - name: EXECUTION_RESTORE_SCENE_ON_ASSEMBLE
              value: "true"
            - name: EXECUTION_LEASE_HEARTBEAT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: execution_lease_heartbeat_enabled
            - name: EXECUTION_LEASE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: execution_lease_ttl_seconds
            # ── 控制面（8090）：实例注册表 / 产物 / 录制 / 画面 ──
            - name: ADAPTER_HOST
              value: "0.0.0.0"
            - name: ADAPTER_PORT
              value: "8090"
            - name: ADAPTER_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_db_path
            - name: ADAPTER_ARTIFACTS_DIR
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_artifacts_dir
            - name: ADAPTER_RECORDINGS_DIR
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_recordings_dir
            - name: ADAPTER_RECORDING_RETENTION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_recording_retention_hours
            # 录制三级闸门：总开关 → sensors[].record → 磁盘余量
            - name: ADAPTER_RECORD_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_record_enabled
            - name: ADAPTER_RECORD_MIN_FREE_GB
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_record_min_free_gb
            - name: ADAPTER_UPLOAD_ON_FAILURE
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_upload_on_failure
            - name: ADAPTER_ARTIFACT_RETENTION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_artifact_retention_hours
            - name: ADAPTER_STREAM_FPS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_stream_fps
            - name: ADAPTER_STREAM_MAX_WIDTH
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_stream_max_width
            - name: ADAPTER_STREAM_MAX_CLIENTS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_stream_max_clients
            - name: ADAPTER_SCREENSHOT_QUALITY
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_screenshot_quality
            - name: ADAPTER_ARTIFACT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_artifact_bucket
            - name: ADAPTER_MAX_SCENE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: adapter_max_scene_seconds
            # ── HunterCore 平台接入（凭据仅经 Secret 注入）──
            - name: HUNTER_CORE_KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: hunter_core_kafka_bootstrap
            - name: HUNTER_CORE_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: hunter_core_security_protocol
            - name: HUNTER_CORE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: hunter_core_gateway_url
            - name: HUNTER_CORE_ROSBAG_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: hunter_core_rosbag_bucket
            - name: HUNTER_CORE_UPLOAD_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: hunter_core_upload_max_retries
            - name: HUNTER_CORE_UPLOAD_RETRY_BACKOFF_S
              valueFrom:
                configMapKeyRef:
                  name: hunter-sim-config
                  key: hunter_core_upload_retry_backoff_s
            - name: HUNTER_CORE_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: sasl_username
                  optional: true
            - name: HUNTER_CORE_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: sasl_password
                  optional: true
            - name: HUNTER_CORE_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hunter-sim-secrets
                  key: jwt_token
                  optional: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          # 就绪判据走探针面聚合健康：CARLA 未连通也返回 200（degraded），
          # 因此 /health/live 只代表进程活着，业务可用性由 /health/ready 与上层告警判定。
          readinessProbe:
            http:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: configs
              mountPath: /home/hunter/app/configs
              readOnly: true
            # 共享存储 PVC（设计文档 §15.1：地图资源/车辆模型/场景配置）
            - name: shared-resources
              mountPath: /home/hunter/app/resources
            # 实例注册表 + 产物 + mcap 录制。SQLite 需独占块存储（RWO），
            # 不使用 NFS/RWX（WAL 锁不可靠）；卷容量需覆盖录制保留期内的数据量。
            - name: data
              mountPath: /home/hunter/app/data

        # ── 只读探针面（kubelet 存活/就绪 + Prometheus 抓取）─────────────────
        - name: probes
          image: hunter-sim:3.0.3
          imagePullPolicy: IfNotPresent
          command: ["huntersim"]
          args: ["probes"]
          ports:
            - containerPort: 8080
              name: probes
              protocol: TCP
          env:
            - name: PROBE_HOST
              value: "0.0.0.0"
            - name: PROBE_PORT
              value: "8080"
            # 同 Pod 内聚合控制面真实状态（CARLA/VIL/传感器/云端）
            - name: PROBE_ADAPTER_URL
              value: "http://127.0.0.1:8090"
            - name: HUNTER_SIM_LOG_LEVEL
              value: "WARNING"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            http:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            http:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: configs
          configMap:
            name: hunter-sim-configs
        - name: shared-resources
          persistentVolumeClaim:
            claimName: hunter-sim-resources-pvc
        - name: data
          persistentVolumeClaim:
            claimName: hunter-sim-data-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# 共享存储 PVC（设计文档 §15.1）
# ReadWriteMany 必须绑定支持 RWX 的 StorageClass（NFS/CephFS/Longhorn 等）。
# 留空会回落集群默认 StorageClass，而默认类多为 RWO（云盘/hostpath），
# 多 Pod 挂载时卡在 FailedMount。集群需预先创建同名 RWX StorageClass。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-sim-resources-pvc
  namespace: hunter-sim
spec:
  accessModes:
    - ReadWriteMany   # 仿真服务层与 CARLA GPU Pod 共享
  storageClassName: huntersim-rwx   # 指向支持 RWX 的 StorageClass（按集群实际名称修改）
  resources:
    requests:
      storage: 500Gi  # §15.2 推荐存储配置
---
# 数据卷（V3.0.0）：实例注册表 SQLite + 产物暂存 + mcap 录制。
# 必须 ReadWriteOnce（块存储/本地盘）；NFS 等 RWX 上的 SQLite WAL 锁不可靠，
# 多副本同时挂载也会损坏数据库，因此保持 sim-service replicas=1。
# 容量规划：单路三传感器录制约 1.5–3 GB/分钟（LiDAR 为主），
# 默认保留 24 小时，按日均仿真时长与并发（单世界=1）估算后调整。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-sim-data-pvc
  namespace: hunter-sim
spec:
  accessModes:
    - ReadWriteOnce
  # 留空回落集群默认 StorageClass；生产建议指定本地 SSD/云盘类（录制为高写入）
  resources:
    requests:
      storage: 200Gi
---
# CARLA 仿真引擎 GPU Pod（设计文档 §15.1/§10.2.3）
# 需要 NVIDIA GPU Operator / Container Toolkit；每 Pod 分配 1 块 GPU。
# 受支持形态 = 单世界串行：一个引擎承载唯一场景。
# 扩容需改 StatefulSet + Headless Service 逐条列出端点，禁止用普通 Deployment
# 多副本 + 单一 ClusterIP（load_world 会互相重置且请求会落到错误引擎）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carla-engine
  namespace: hunter-sim
  labels:
    app: hunter-sim
    component: carla-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunter-sim
      component: carla-engine
  template:
    metadata:
      labels:
        app: hunter-sim
        component: carla-engine
    spec:
      containers:
        - name: carla
          image: hunter-carla:0.9.16   # docker/Dockerfile.carla（§15.3）
          imagePullPolicy: IfNotPresent
          args: ["-RenderOffScreen", "-quality-level=Medium", "-fps=30"]  # §13.4/附录 A
          ports:
            - containerPort: 2000
              name: rpc
            - containerPort: 2001
              name: streaming
          resources:
            limits:
              nvidia.com/gpu: "1"      # NVIDIA Container Toolkit 分配
            requests:
              memory: "8Gi"            # §13.3 单实例内存 4-8GB
              cpu: "4"
          volumeMounts:
            - name: shared-resources
              mountPath: /home/carla/carla/PythonAPI/hunter_assets/resources
      volumes:
        - name: shared-resources
          persistentVolumeClaim:
            claimName: hunter-sim-resources-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
# CARLA 引擎集群内访问入口（供 CARLA_HOST=carla-engine-svc 使用，
# 优于 configmap 中硬编码宿主机 IP 的双机分离模式）
apiVersion: v1
kind: Service
metadata:
  name: carla-engine-svc
  namespace: hunter-sim
spec:
  selector:
    app: hunter-sim
    component: carla-engine
  ports:
    - name: rpc
      port: 2000
      targetPort: 2000
    - name: streaming
      port: 2001
      targetPort: 2001
  type: ClusterIP
