# HunterSim K8s 敏感配置（占位模板）
# 部署前请替换为真实值，或通过 CI/CD、SealedSecrets 注入：
#   kubectl -n hunter-sim create secret generic hunter-sim-secrets \
#     --from-literal=jwt_secret="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
apiVersion: v1
kind: Secret
metadata:
  name: hunter-sim-secrets
  namespace: hunter-sim
type: Opaque
stringData:
  jwt_secret: "REPLACE_BEFORE_DEPLOY"
