# HunterSim K8s 敏感配置（占位模板，V3.0.0）
# 部署前请替换为真实值，或通过 CI/CD、SealedSecrets 注入：
#   kubectl -n hunter-sim create secret generic hunter-sim-secrets \
#     --from-literal=sasl_username="<Kafka SASL 用户>" \
#     --from-literal=sasl_password="<Kafka SASL 口令>" \
#     --from-literal=jwt_token="<data-collector Bearer JWT>"
# 说明：V3.0.0 起服务内置鉴权（JWT/CORS/内置管理员）已随 8080 治理面移除，
# 本 Secret 只承载「仿真端 → 云端」的出向凭据（HunterCore 数据面与 MinIO 上传）。
apiVersion: v1
kind: Secret
metadata:
  name: hunter-sim-secrets
  namespace: hunter-sim
type: Opaque
stringData:
  sasl_username: "REPLACE_BEFORE_DEPLOY"
  sasl_password: "REPLACE_BEFORE_DEPLOY"
  jwt_token: "REPLACE_BEFORE_DEPLOY"
