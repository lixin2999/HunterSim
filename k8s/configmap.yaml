# HunterSim K8s 配置（非敏感，V3.0.0）
# deployment.yaml 引用 hunter-sim-config（环境变量）与 hunter-sim-configs（配置文件挂载）
# 敏感项（SASL 账号口令、data-collector JWT）见 secret.yaml，不在此处出现。

apiVersion: v1
kind: ConfigMap
metadata:
  name: hunter-sim-config
  namespace: hunter-sim
data:
  # ── CARLA 引擎 ──
  # 集群内引擎填 carla-engine-svc；双机分离部署填宿主机 IP
  carla_host: "carla-engine-svc"
  carla_rpc_port: "2000"
  carla_stream_port: "2001"
  # ── Kafka（VIL 遥测消费 + sensor_data 回传）──
  kafka_bootstrap_servers: "kafka:9092"
  # 消费自愈与坏消息 DLQ：连续错误达阈值重建消费者；dlq_topic 空则仅计数不转发
  kafka_enable_self_heal: "true"
  kafka_rebuild_after_errors: "10"
  kafka_dlq_topic: ""
  # ── VIL 链路对齐（V3.0.0）：10Hz 栅格降采样 + 时间对齐插值 ──
  # target_hz 需与服务端仿真步长一致（fixed_delta_seconds=0.02 → 50Hz 上限内取 10）
  vil_target_hz: "10.0"
  vil_ordering_guard_enabled: "true"
  vil_auto_buffer_depth: "true"
  # 超过该延迟即认定断流，实例置 PAUSED(vil_data_interrupted)
  vil_max_data_latency_ms: "500"
  # ── 资源与执行面（单世界串行）──
  resource_instance_max_lifetime_seconds: "7200"
  resource_health_check_interval_seconds: "10"
  execution_lease_heartbeat_enabled: "true"
  execution_lease_ttl_seconds: "120"
  # ── 控制面（8090）：实例注册表 / 产物 / 录制 / 画面 ──
  # SQLite 与 mcap 录制挂载在 hunter-sim-data-pvc（RWO）上
  adapter_db_path: "/home/hunter/app/data/adapter/carla_instances.db"
  adapter_artifacts_dir: "/home/hunter/app/data/adapter/artifacts"
  adapter_recordings_dir: "/home/hunter/app/data/adapter/recordings"
  adapter_recording_retention_hours: "24"
  adapter_stream_fps: "10"
  # MJPEG 横向降采样上限（像素，0 = 不降采样）；降低内网带宽与前端解码开销
  adapter_stream_max_width: "640"
  adapter_screenshot_quality: "75"
  adapter_artifact_bucket: "hunter-scene-assets"
  adapter_max_scene_seconds: "7200"
  # ── HunterCore 平台接入 ──
  # 启用开关与 sim_id 由平台侧注入（HUNTER_CORE_ENABLED / HUNTER_CORE_SIM_ID）
  hunter_core_kafka_bootstrap: "192.168.31.35:9092"
  hunter_core_security_protocol: "SASL_SSL"
  hunter_core_gateway_url: "http://192.168.31.35:8080"
  hunter_core_rosbag_bucket: "hunter-rosbag"
  # ── 日志 ──
  # 生产采集建议置 "true"（JSON 行 + request_id 贯穿）
  log_json: "false"

---
# 配置文件挂载源。生产环境建议由 configs/ 目录生成：
#   kubectl -n hunter-sim create configmap hunter-sim-configs \
#     --from-file=configs/ --dry-run=client -o yaml | kubectl apply -f -
# 此处提供占位对象，保证 deployment.yaml 可独立 apply 成功。
apiVersion: v1
kind: ConfigMap
metadata:
  name: hunter-sim-configs
  namespace: hunter-sim
data: {}
