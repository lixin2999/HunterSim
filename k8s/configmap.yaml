# HunterSim K8s 配置（非敏感）
# deployment.yaml 引用 hunter-sim-config（环境变量）与 hunter-sim-configs（配置文件挂载）

apiVersion: v1
kind: ConfigMap
metadata:
  name: hunter-sim-config
  namespace: hunter-sim
data:
  # Windows 宿主机上运行的 CARLA Server 地址（双机分离部署）
  carla_host: "192.168.1.100"
  carla_rpc_port: "2000"
  carla_stream_port: "2001"
  kafka_bootstrap_servers: "kafka:9092"
  # prod 启动闸门禁止 "*"；按实际前端域名配置（JSON 数组）
  cors_allow_origins: '["https://sim.example.com"]'
  # 执行面（V2.4.0）：CARLA 引擎端点库存，逗号分隔 host:rpc[:stream[:tm]]。
  # 单引擎填 carla-engine-svc:2000；多引擎扩 Pod 后按 StatefulSet 稳定 DNS 逐条列出。
  execution_engine_endpoints: "carla-engine-svc:2000"
  execution_max_engines: "8"
  # 状态持久化（V2.4.0）：SQLite 落独立 RWO 卷，Pod 重建后实例/场景绑定可恢复
  state_enabled: "true"
  state_db_path: "/home/hunter/app/data/state/hunter_sim.db"
  # 平台化（V2.5.0）：多租户、租户配额、服务账号 API Key、审计落库
  platform_default_tenant: "default"
  platform_max_instances_per_tenant: "20"
  platform_api_keys_enabled: "true"
  platform_audit_enabled: "true"
  # 安全治理（V2.6.0）：按客户端 IP 限流 + /auth/token 失败指数退避（进程内计数，单副本权威）
  api_rate_limit_enabled: "true"
  api_rate_limit_per_minute: "1000"
  api_login_max_failed_attempts: "5"
  api_login_backoff_base_seconds: "2"
  api_login_backoff_max_seconds: "60"

---
# 配置文件挂载源。生产环境建议由 configs/ 目录生成：
#   kubectl -n hunter-sim create configmap hunter-sim-configs \
#     --from-file=configs/ --dry-run=client -o yaml | kubectl apply -f -
# 此处提供占位对象，保证 deployment.yaml 可独立 apply 成功。
apiVersion: v1
kind: ConfigMap
metadata:
  name: hunter-sim-configs
  namespace: hunter-sim
data: {}
