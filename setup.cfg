# flake8 配置（质量门禁：与 mypy strict 并行执行）
[flake8]
max-line-length = 120
# D1xx: 不强制所有模块/类/方法写 docstring（与存量代码风格对齐）
# D400/D403/D406-D415: 项目 docstring 以中文为主，英文句号/时态/Section 类规则不适用
# D203/D212/E265: 格式类规则冲突项
extend-ignore = D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,E265,D400,D403,D406,D407,D408,D409,D410,D411,D412,D413,D414,D415
exclude = .venv,__pycache__,.pytest_cache,build,dist
per-file-ignores =
    # HTML 模板字符串中的 CSS 行无法拆行
    src/hunter_sim/eval_service/evaluation_report.py: E501
    # 测试中 lambda/assert 行较长可读性更好
    tests/test_instances_router.py: E501
    tests/test_data_converters.py: E501
    tests/test_scene_converter.py: E501
statistics = True
