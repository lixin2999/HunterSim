# VIL 实车在环示例配置：与 default_scenario.yaml 结构一致，额外开启 vil 节。
# 使用方式：huntersim vil-run --config configs/vil_scenario.yaml
scenario:
  name: "vil_live_mirror"
  map: "Town04"
  duration_seconds: 600
  tick_rate: 50  # Hz（VIL 20ms 固定步长）
  simulation_mode:
    mode: "synchronous"          # VIL 强制同步模式
    fixed_delta_seconds: 0.02    # 20ms
    substepping: true
    max_substep_delta_time: 0.01
    max_substeps: 4

vehicle:
  blueprint: "vehicle.tesla.model3"
  spawn_point_index: 0
  color: "255,0,0"
  physics:
    mass: 1840
    drag_coefficient: 0.23

sensors:
  - id: "rgb_front"
    type: "camera.rgb"
    position: [0, 0, 1.6]
    rotation: [0, 0, 0]
    width: 1920
    height: 1080
    fov: 90
    tick_rate: 10

weather:
  preset: "clear_noon"

traffic:
  npc_vehicles: 30
  npc_walkers: 10
  traffic_manager_port: 8000

output:
  base_dir: "./data/runs"
  formats:
    camera: "png"
    lidar: "hdf5"
    telemetry: "msgpack"

# ---- VIL 模块配置（§4） ----
vil:
  enabled: true
  kafka_bootstrap_servers: "kafka:9092"
  kafka_group_id: "carla-vil"
  telemetry_topic: "telemetry_clean"
  command_topic_pattern: "hunter.{vehicle_id}.command_result"
  target_vehicle_id: "hunter-001"
  # 初始标定：操作员在仿真地图中指定实车对应位置与朝向（§4.3.2）
  calibration:
    x0: 100.0
    y0: 250.0
    yaw0_deg: 0.0        # 亦可直接给 yaw0_rad
  delay_compensation_ms: 150.0
  data_timeout_ms: 500.0
  extrapolation_threshold_ms: 50.0
  ego_z_offset: 0.3
