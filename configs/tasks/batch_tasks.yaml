# 批量任务调度配置（供 L5 app.scheduler 使用）
# 每个任务引用一个场景配置文件；connection 指定目标 CARLA 实例。
tasks:
  - name: "highway_noon"
    config: "configs/default_scenario.yaml"
    connection:
      host: "localhost"
      port: 2000
  - name: "highway_rain"
    config: "configs/default_scenario.yaml"
    connection:
      host: "localhost"
      port: 2000
      override:
        weather:
          preset: "heavy_rain"   # 预设环境（§3.4.2）：大雨，能见度降低

execution:
  mode: "sequential"   # sequential / parallel
  max_parallel: 1
  retry_on_failure: 2
  skip_on_error: true
