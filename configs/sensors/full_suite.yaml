# 全量传感器套件（可被场景配置引用 / 组合）
# 每项对应 hunter_sim.core.config.SensorConfig
sensors:
  - id: "rgb_front"
    type: "camera.rgb"
    position: [0.0, 0.0, 1.6]
    rotation: [0.0, 0.0, 0.0]
    width: 1920
    height: 1080
    fov: 90
    tick_rate: 30
  - id: "depth_front"
    type: "camera.depth"
    position: [0.0, 0.0, 1.6]
    rotation: [0.0, 0.0, 0.0]
    width: 1280
    height: 720
    fov: 90
    tick_rate: 30
  - id: "semantics_front"
    type: "camera.semantic_segmentation"
    position: [0.0, 0.0, 1.6]
    rotation: [0.0, 0.0, 0.0]
    width: 1280
    height: 720
    fov: 90
    tick_rate: 30
  - id: "lidar_top"
    type: "lidar.ray_cast"
    position: [0.0, 0.0, 2.0]
    rotation: [0.0, 0.0, 0.0]
    channels: 64
    range: 100
    points_per_second: 1300000
    rotation_frequency: 10
    tick_rate: 10
  - id: "radar_front"
    type: "other.detection2d_radar"
    position: [0.0, 0.0, 1.0]
    rotation: [0.0, 0.0, 0.0]
    range: 100
    tick_rate: 10
  - id: "imu"
    type: "other.imu"
    position: [0.0, 0.0, 1.0]
    rotation: [0.0, 0.0, 0.0]
    tick_rate: 100
  - id: "gnss"
    type: "other.gnss"
    position: [0.0, 0.0, 1.0]
    rotation: [0.0, 0.0, 0.0]
    tick_rate: 10
