[project]
name = "hunter-sim"
version = "2.1.1"
description = "HunterSim - VIL Virtual Simulation Platform for HUNTER SE Autonomous Driving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "HunterPilot Team"}
]

dependencies = [
    "fastapi>=0.100,<0.110",
    "uvicorn[standard]>=0.23,<0.30",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.11,<2.0",
    "kafka-python>=2.0,<3.0",
    "websockets>=11.0,<13.0",
    "httpx>=0.24,<0.28",
    "aiofiles>=23.0,<24.0",
    "python-multipart>=0.0.6,<0.1",
    "orjson>=3.9,<4.0",
    "structlog>=23.0,<24.0",
    "prometheus-client>=0.17,<0.27",
    "PyYAML>=6.0,<7.0",
    "defusedxml>=0.7,<1.0",
    "Jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.21,<0.24",
    "pytest-cov>=4.1,<5.0",
    "httpx>=0.24,<0.28",
    "mypy>=1.5,<2.0",
    "flake8>=6.1,<7.0",
    "flake8-docstrings>=1.7,<2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short"
markers = [
    "unit: Unit tests (MockCarla only)",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src/hunter_sim"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
