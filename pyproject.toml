[project]
name = "hunter-sim"
version = "2.10.0"
description = "HunterSim - VIL Virtual Simulation Platform for HUNTER SE Autonomous Driving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "HunterPilot Team"}
]

dependencies = [
    "fastapi>=0.100,<0.110",
    "uvicorn[standard]>=0.23,<0.30",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.11,<2.0",
    "kafka-python>=2.0,<3.0",
    "websockets>=11.0,<13.0",
    "httpx>=0.24,<0.28",
    "aiofiles>=23.0,<24.0",
    "python-multipart>=0.0.6,<0.1",
    "orjson>=3.9,<4.0",
    "structlog>=23.0,<24.0",
    "prometheus-client>=0.17,<0.27",
    "PyYAML>=6.0,<7.0",
    "defusedxml>=0.7,<1.0",
    "Jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.21,<0.24",
    "pytest-cov>=4.1,<5.0",
    "httpx>=0.24,<0.28",
    "mypy>=1.5,<2.0",
    "flake8>=6.1,<7.0",
    "flake8-docstrings>=1.7,<2.0",
]
# Windows 桌面仿真客户端（PySide6，惰性导入，不装不影响 hunter_sim 核心）
gui = [
    "PySide6>=6.6,<7.0",
]
# HunterCore 数据接入（Kafka 遥测 + MinIO bag 直传）；默认依赖已含 kafka-python/httpx
cloud = [
    "kafka-python>=2.0,<3.0",
    "httpx>=0.24,<0.28",
]

[project.scripts]
hunter-sim-gui = "hunter_sim.gui.app:main"
# V2.8.0 P2-16：部署预检 CLI（huntersim doctor / huntersim version）
huntersim = "hunter_sim.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short"
markers = [
    "unit: Unit tests (MockCarla only)",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# pydantic v2 插件：识别 BaseSettings/Field 默认值，消除必填参数误报
plugins = ["pydantic.mypy"]

# CARLA / ROS2 / psycopg2 等可选引擎依赖无类型 stub：惰性导入环境下降级跳过
[[tool.mypy.overrides]]
module = [
    "carla.*",
    "rclpy.*",
    "sensor_msgs.*",
    "std_msgs.*",
    "geometry_msgs.*",
    "nav_msgs.*",
    "rosbag2_py.*",
    "custom_msgs.*",
    "psycopg2.*",
    "jose.*",
    "kafka.*",
    "defusedxml.*",
    "PySide6.*",
    "scenario_runner.*",
]
ignore_missing_imports = true

# Qt-only 桌面界面模块：需 PySide6 类型 stub，验证环境（无 Qt）下基类解析为 Any，
# 无法严格类型检查；按计划这些组件不纳入单测/静态门禁（见 V2.2.0 §5/§6）。
# 非界面逻辑（scenario_launcher / camera_bridge / sim_presets / theme）仍保持 strict。
[[tool.mypy.overrides]]
module = [
    "hunter_sim.gui.sim_worker",
    "hunter_sim.gui.main_window",
    "hunter_sim.gui.app",
    "hunter_sim.gui.panels.*",
    "hunter_sim.gui.views.*",
    "hunter_sim.gui.widgets.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/hunter_sim"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    # Qt-only 桌面界面组件：需 PySide6 运行时，按计划不纳入单测（见 V2.2.0 §6）
    "*/gui/main_window.py",
    "*/gui/app.py",
    "*/gui/sim_worker.py",
    "*/gui/panels/*",
    "*/gui/views/*",
    "*/gui/widgets/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
