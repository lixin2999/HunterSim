[project]
name = "hunter-sim"
version = "3.1.1"
description = "HunterSim - VIL Virtual Simulation Platform for HUNTER SE Autonomous Driving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "HunterPilot Team"}
]

dependencies = [
    "fastapi>=0.100,<0.110",
    "uvicorn[standard]>=0.23,<0.30",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.11,<2.0",
    "kafka-python>=2.0,<3.0",
    "httpx>=0.24,<0.28",
    "orjson>=3.9,<4.0",
    "structlog>=23.0,<24.0",
    "prometheus-client>=0.17,<0.27",
    "PyYAML>=6.0,<7.0",
    "defusedxml>=0.7,<1.0",
    "Jinja2>=3.1,<4.0",
    # V3.0.0 传感器录制：纯 Python 写入 mcap（不依赖 ROS2 运行时）
    "mcap>=1.1,<2.0",
    "mcap-ros2-support>=0.5,<0.7",
    # V3.0.0 画面回传：JPEG 编码 + 降采样（缺失时降级为纯 Python PNG）
    "Pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.21,<0.24",
    "pytest-cov>=4.1,<5.0",
    "httpx>=0.24,<0.28",
    "mypy>=1.5,<2.0",
    "flake8>=6.1,<7.0",
    "flake8-docstrings>=1.7,<2.0",
]
# HunterCore 数据接入（Kafka 遥测 + MinIO bag 直传）；默认依赖已含 kafka-python/httpx
cloud = [
    "kafka-python>=2.0,<3.0",
    "httpx>=0.24,<0.28",
]

[project.scripts]
# V2.8.0 P2-16：部署预检 CLI（huntersim doctor / huntersim version）
huntersim = "hunter_sim.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 可视化客户端是纯静态单页应用（无构建步骤），需随包分发
[tool.setuptools.package-data]
"hunter_sim.visualization" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short"
markers = [
    "unit: Unit tests (MockCarla only)",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# pydantic v2 插件：识别 BaseSettings/Field 默认值，消除必填参数误报
plugins = ["pydantic.mypy"]

# CARLA / ROS2 / psycopg2 等可选引擎依赖无类型 stub：惰性导入环境下降级跳过
[[tool.mypy.overrides]]
module = [
    "carla.*",
    "rclpy.*",
    "sensor_msgs.*",
    "std_msgs.*",
    "geometry_msgs.*",
    "nav_msgs.*",
    "rosbag2_py.*",
    "custom_msgs.*",
    "psycopg2.*",
    "kafka.*",
    "defusedxml.*",
    "mcap.*",
    "mcap_ros2.*",
    "PIL.*",
    "scenario_runner.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/hunter_sim"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
